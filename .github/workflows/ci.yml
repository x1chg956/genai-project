# Push tier (docs/11 §6), Phase 1 scope: lint, tests, generated evidence. No live model or database calls.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Generated evidence is up to date (docs/11 §8)
        run: |
          make docs-evidence
          git diff --exit-code -- docs/tool_catalogue.md 'docs/graph_*.md' || {
            echo "::error::regenerate the evidence with make docs-evidence and commit it"; exit 1; }
