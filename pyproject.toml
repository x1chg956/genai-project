[project]
name = "auditguard"
version = "0.1.0"
description = "Evidence-grounded assistant for AML alert investigation and STR preparation (synthetic data, mock portal)"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.22.1",
    "fastmcp==4.1.6",
    "httpx==0.28.1",
    "langchain-openai==1.7.4",
    "langchain-core==1.7.6",
    "langsmith==0.14.17",
    "langchain[mcp]==1.4.9",
    "langgraph==1.2.20",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langgraph-prebuilt==1.1.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "langgraph-checkpoint-postgres==3.2.0",  # Phase 2 task 5: Postgres checkpointer
    "prometheus-client==0.26.0",  # tool and case metrics (docs/08 §5, docs/11 §6)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditguard", "mcp_servers", "data", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]   # specs change only by deliberate edits

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # *_token fields are synthetic identifiers, not secrets

[tool.mypy]
python_version = "3.11"
strict = true
files = ["auditguard", "mcp_servers", "scripts", "data", "eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]          # untyped; used only in regulatory_kb/index.py
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls a real model server or database (excluded by default)",
    "tool(name): the MCP tool this test exercises (docs/11 §8; the tool catalogue needs one per tool)",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.15",  # property tests for rules (docs/02 Phase 2 task 2)
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "types-pyyaml==6.0.12.20261103",
]

[tool.uv]
# Pin rule (CLAUDE.md): only releases at least two weeks old. Move this date forward
# deliberately when upgrading, never past today minus 14 days.
exclude-newer = "2026-11-07T00:00:00Z"
