# AuditGuard: the one versioned config (docs/11 §1, docs/13 §2).
# ${VAR} and ${VAR:-default} are expanded from the environment and .env by auditguard/config.py.
# Experiment configs in configs/experiments/ override this file; they never change code paths.
config_version: 1
profile: IN
timezone: Asia/Kolkata

providers:
  local:
    base_url: ${LLM_BASE_URL:-http://127.0.0.1:8888/v1}
    api_key: ${LLM_API_KEY:-}                  # required by the local oMLX server; set in .env only
    timeout_s: 120
    extra_body: {chat_template_kwargs: {enable_thinking: false}}   # oMLX/Qwen: stop thinking text leaking into content
    structured_method: json_schema             # verified on oMLX
    cost_per_1k_tokens: {input: "0", output: "0"}   # local runs cost nothing; tokens are still counted
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY:-}
    timeout_s: 60
    cost_per_1k_tokens: null                   # filled from OpenRouter pricing when used

models:
  supervisor: {provider: local, id: "${LLM_MODEL:-Qwen3.5-9B-OptiQ-4bit}", temperature: 0,   max_tokens: 2000}
  specialist: {provider: local, id: "${LLM_MODEL:-Qwen3.5-9B-OptiQ-4bit}", temperature: 0.2, max_tokens: 3000}
  decomposer: {provider: local, id: "${LLM_MODEL:-Qwen3.5-9B-OptiQ-4bit}", temperature: 0,   max_tokens: 400}
  judge:      {provider: "${JUDGE_PROVIDER:-local}", id: "${JUDGE_MODEL:-gemma-4-e2b-it-OptiQ-4bit}", temperature: 0, max_tokens: 1500,
               stop: ["<end_of_turn>"]}   # needed for Gemma 3 on oMLX; Gemma 4 stops cleanly without it, harmless (docs/13 §1b)
  guard:      {provider: "${GUARD_PROVIDER:-local}", id: "${GUARD_MODEL:-Llama-Guard-3-1B-chat-mlx-4bit}", temperature: 0,
               max_tokens: 20, mode: "${GUARD_MODE:-completions_raw}",
               prompt_template: "${GUARD_PROMPT_TEMPLATE:-prompts/guard_llama_guard_3.txt}"}
  fallback:   {provider: openrouter, id: null, enabled: false}   # pin id before enabling; a switch is logged and flagged

prompts:
  single_agent: prompts/single_agent.md
  supervisor: prompts/supervisor.md
  investigator: prompts/investigator.md
  researcher: prompts/researcher.md
  drafter: prompts/drafter.md
  critic_judge: prompts/critic_judge.md

graph: c1                                      # c0 | c1 | c2

tracing:                                       # docs/11 §7: every model call traced; live runs refuse "none"
  backend: ${TRACING_BACKEND:-langsmith}       # langsmith | langfuse (Phase 7 profile) | none (unit tests only)
  project: ${TRACING_PROJECT:-auditguard}
  endpoint: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  api_key: ${LANGSMITH_API_KEY:-}
  workspace_id: ${LANGSMITH_WORKSPACE_ID:-}    # needed when the key is scoped to an organisation

budgets:
  case: {steps: 12, tool_calls: 20, tokens: 60000, seconds: 180, cost_usd: "0.50"}
  critic_revisions: 2

retrieval: {bm25: true, vector: true, rerank: true, decompose: true,
            k_bm25: 20, k_vector: 20, k_final: 5, rrf_k: 60, score_floor: 0.2}

rules: {pack: rules/IN, version: "1.0.0"}
corpus:
  manifest: corpus/manifest.yaml
  version: null                                # set by the first ingest
  passages: ${CORPUS_PASSAGES:-corpus/processed/passages.jsonl}   # written by scripts/ingest.py

databases:                                     # local Postgres on 5432; Compose Postgres on host 5433
  app:
    host: ${POSTGRES_HOST:-localhost}
    port: ${POSTGRES_PORT:-5432}
    name: ${POSTGRES_DB:-auditguard}
    user: ${POSTGRES_USER:-auditguard}
    password: ${POSTGRES_PASSWORD:-}
  groundtruth:                                 # eval/ and data/generator/ only; never the app or MCP servers
    host: ${POSTGRES_HOST:-localhost}
    port: ${POSTGRES_PORT:-5432}
    name: ${GROUNDTRUTH_DB:-groundtruth}
    user: ${GROUNDTRUTH_USER:-groundtruth}
    password: ${GROUNDTRUTH_PASSWORD:-}
  ledger_ro:                                   # transactions + aml_engine servers: SELECT on ledger.* only
    host: ${POSTGRES_HOST:-localhost}
    port: ${POSTGRES_PORT:-5432}
    name: ${POSTGRES_DB:-auditguard}
    user: ${LEDGER_RO_USER:-auditguard_ro}
    password: ${LEDGER_RO_PASSWORD:-}

qdrant: {url: "${QDRANT_URL:-http://localhost:6333}"}

guardrails:
  input: {schema: true, pseudonymise: true, prompt_guard: false, llama_guard: false, scope: true}
  output: {provenance: true, pii: true, neutral_wording: true, tipping_off: true}

memory: {short_term: {keep_turns: 12}, long_term: {enabled: false, max_lessons: 2}}

approval:
  ttl_minutes: 120
  hmac_key: ${APPROVAL_HMAC_KEY:-}
  store_path: ${APPROVAL_STORE:-var/approvals.db}   # Phase 1 SQLite; Postgres from Phase 2

ingest:                                        # ingest_validate (code node), docs/03 §2
  window_days: 60                              # local days ending on the alert's detection date

checkpointer:                                  # Phase 1: SQLite; Postgres from Phase 2 (thread_id = run_id)
  path: ${CHECKPOINT_DB:-var/checkpoints.db}

str_report:                                    # fixed parts of the mock FIU-IND STR payload (docs/08 §1)
  reason_codes: configs/reason_codes.yaml      # fired rule -> reason code; analyst confirms at approval
  reporting_entity: {name: "Synthetic Commercial Bank (mock)", code: "RE-SYN-0001"}
  principal_officer: {id: "PO-SYN-0001", designation: "Principal Officer (synthetic)"}
  branch: {code: "BR-SYN-0001", name: "Synthetic Branch (mock)"}

filing_portal:                                 # mock FIU-IND portal, own SQLite
  db_path: ${PORTAL_DB:-var/portal.db}
  form_limits:                                 # project placeholders; confirm with the domain reviewer
    max_payload_bytes: 200000
    max_grounds_chars: 8000

mcp:
  transport: ${MCP_TRANSPORT:-stdio}           # http in Docker
  http_host: ${MCP_HTTP_HOST:-127.0.0.1}
  servers:                                     # python -m <module>; port is used for http only
    transactions:   {module: mcp_servers.transactions,   port: 8101}
    aml_engine:     {module: mcp_servers.aml_engine,     port: 8102}
    regulatory_kb:  {module: mcp_servers.regulatory_kb,  port: 8103}
    filing_portal:  {module: mcp_servers.filing_portal,  port: 8104}
  token_key: ${MCP_TOKEN_KEY:-}                # HMAC key for agent tokens; set in .env only
  token_ttl_minutes: 60
  max_rows: 200                                # no tool returns more rows than this
  allow_list:                                  # caller -> tools (docs/05); checked by every server
    ingest_validate: [get_transactions, get_kyc_profile, get_linked_accounts]
    single_agent: [get_transactions, get_account_summary, get_counterparty_flows, get_kyc_profile,
                   get_linked_accounts, get_peer_baseline, get_prior_reports, evaluate_rules,
                   get_rule_metadata, search_passages, get_passage, search_typologies,
                   list_document_versions]
    investigator: [get_account_summary, get_counterparty_flows, get_peer_baseline, get_prior_reports,
                   evaluate_rules, get_rule_metadata, search_typologies]
    researcher: [search_passages, get_passage, list_document_versions]
    critic: [get_passage, get_transactions, get_rule_metadata]
    build_payload: [prepare_payload]
    submit: [submit_approved_payload, get_receipt]
  description_hashes: {}                       # pinned in Phase 6
